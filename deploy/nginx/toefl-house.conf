# =============================================================================
# The TOEFL House — production web server (nginx + PHP-FPM)
# =============================================================================
# Reference target for the production deployment. Provider-neutral: the same
# configuration runs on nginx on any host (VPS, on-prem, container host).
#
# Security properties enforced HERE (at the edge), not just in the app:
#   * The document root is the Laravel `public/` directory ONLY. The project
#     root (app/, config/, .env, database/, storage/, .git) is never reachable
#     over HTTP — no path traversal can escape the docroot because PHP is the
#     only executor and every non-file request is routed to the front
#     controller (public/index.php).
#   * TLS is terminated here (HTTPS). Replace the self-signed cert paths with
#     your CA-issued certificate (e.g. Let's Encrypt / ACME).
#   * Security headers are set at the edge so they apply to every response,
#     including ones the app might not.
#   * A separate, unauthenticated health endpoint is exposed for orchestrators.
# =============================================================================

# PHP-FPM upstream. Matches deploy/php-fpm.conf (listen = unix socket).
upstream toefl_house_php {
    server unix:/run/php/php8.2-fpm.sock;
    # For a TCP FPM pool use: server 127.0.0.1:9000;
}

# HTTP -> HTTPS redirect (the assumption: production is served over TLS).
server {
    listen 80;
    listen [::]:80;
    server_name toeflhouse.example.com;   # TODO: set your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name toeflhouse.example.com;   # TODO: set your domain

    # --- TLS (replace with your CA-issued certificate) ----------------------
    ssl_certificate     /etc/letsencrypt/live/toeflhouse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toeflhouse.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Document root: public/ ONLY ----------------------------------------
    root  /var/www/toefl-house/current/public;
    index index.php;

    # Never serve dotfiles (defense in depth against .env / .git exposure).
    location ~ /\. {
        deny all;
    }

    # Security headers (mirror app/Http/Middleware/SecurityHeaders.php).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Health/readiness probe for orchestrators (bypasses app auth by design;
    # the handler itself checks the DB and returns 200/503).
    location = /health {
        try_files $uri @php;
    }

    # Static assets are served directly when present.
    location / {
        try_files $uri $uri/ @php;
    }

    # Everything else goes to the front controller.
    location @php {
        fastcgi_pass toefl_house_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_read_timeout 60s;
    }

    # PHP files are never served raw (they are only ever executed via FPM and
    # only through index.php, so direct access to app code is impossible).
    location ~ \.php$ {
        return 403;
    }

    access_log /var/log/nginx/toefl-house.access.log;
    error_log  /var/log/nginx/toefl-house.error.log;
}
