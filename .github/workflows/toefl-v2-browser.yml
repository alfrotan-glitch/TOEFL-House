name: TOEFL House V2 Real Browser Design QA
on:
  push:
    branches: [website-v2-redesign-20261118]
    paths:
      - 'cloudflare/site-v2/preview-browser.cjs'
      - '.github/workflows/toefl-v2-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/toefl-v2-browser --no-save playwright-core@1.56.0 --silent
      - name: Verify mobile/desktop English, Dari, Pashto, tools and CMS
        run: node cloudflare/site-v2/preview-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toefl-house-v2-six-layouts
          path: toefl-v2-browser-results/
          retention-days: 7
          if-no-files-found: ignore
