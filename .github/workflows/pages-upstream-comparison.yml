name: Compare original immutable Pages and live alias (read only)
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyze immutable deployment without mutation
        run: node cloudflare/website-verification/compare.mjs
