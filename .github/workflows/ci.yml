name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ci-only-jwt-secret-not-used-in-production-0123456789
  NODE_ENV: test

jobs:
  frontend:
    name: Frontend — typecheck, lint, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:bundle

  backend:
    name: Backend — typecheck, tests, schema preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Lint (eslint + tsc)
        working-directory: server
        run: npm run lint

      - name: Test suite
        working-directory: server
        run: npm test

      - name: Fresh-schema preflight
        working-directory: server
        run: npm run preflight:fresh-schema

  static-audit:
    name: Static audit — architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - run: npm run audit:static

  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Release validation
        run: npm run release:validate
