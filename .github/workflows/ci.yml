name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NODE_ENV is deliberately NOT set globally. It was, and it silently broke the
# frontend job: with NODE_ENV=test Vite skips production chunking, so the React
# vendor chunk disappeared and first-paint weight went 482 KB -> 701 KB, failing
# the bundle budget for a reason that had nothing to do with the code. Only the
# backend job needs it, so it is set there.
env:
  JWT_SECRET: ci-only-jwt-secret-not-used-in-production-0123456789

jobs:
  frontend:
    name: Frontend — typecheck, lint, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:bundle

  backend:
    name: Backend — typecheck, tests, schema preflight
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Lint (eslint + tsc)
        working-directory: server
        run: npm run lint

      - name: Test suite
        working-directory: server
        run: npm test

      - name: Fresh-schema preflight
        working-directory: server
        run: npm run preflight:fresh-schema

  static-audit:
    name: Static audit — architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - run: npm run audit:static

  release-validation:
    name: Release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Release validation
        run: npm run release:validate
