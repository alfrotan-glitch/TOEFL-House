name: TOEFL House V2 — Production Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/site-v2/**'
      - 'cloudflare/pages-edge/**'
      - 'cloudflare/cms-readiness/**'
      - '.github/workflows/toefl-v2-production-quality.yml'
  pull_request:
    paths:
      - 'cloudflare/site-v2/**'
      - 'cloudflare/pages-edge/**'
      - 'cloudflare/cms-readiness/**'
      - '.github/workflows/toefl-v2-production-quality.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: toefl-v2-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Compile & test production website
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile versioned Pages Worker
        run: node cloudflare/site-v2/build.mjs
      - name: Check JavaScript syntax
        run: |
          node --check cloudflare/site-v2/dist/_worker.js
          node --check cloudflare/site-v2/site.js
      - name: Verify CMS, multilingual pages, conversion tracking and fallback
        run: |
          node --test cloudflare/site-v2/tests/*.test.mjs
          node --test cloudflare/pages-edge/tests/*.test.mjs
          node --test cloudflare/analytics/tests/*.test.mjs
      - name: Verify the live recovery preview (read-only)
        env:
          TOEFL_QA_BASE: https://recovery-final-preview-20261.toeflhouse.pages.dev
        run: |
          node cloudflare/site-v2/production-full-acceptance.mjs
          node cloudflare/site-v2/final-production-navigation.mjs
          node cloudflare/site-v2/general-english-live-acceptance.mjs
          node cloudflare/cms-readiness/public-auth-readonly.mjs
          node cloudflare/cms-readiness/legacy-dependency.mjs
      - name: Audit the recovery preview for WCAG A and AA
        run: |
          npm install --prefix /tmp/toefl-accessibility --no-save playwright-core@1.56.0 axe-core@4.10.3 --silent
          TOEFL_QA_BASE=https://restore-public-site-20261122.toeflhouse.pages.dev node cloudflare/site-v2/accessibility-audit.cjs
      - name: Enforce Cloudflare server-rendered Worker size budget
        run: |
          # Guide layouts, localization and CMS content are server-rendered; visitors download only compressed CSS/JS.
          # The Worker embeds reviewed EN/FA/PS editorial copy, course detail modules and learning guides.
          # Keep a 400 KB source budget; client downloads remain the separately versioned CSS/JS below.
          test $(wc -c < cloudflare/site-v2/dist/_worker.js) -lt 400000
          # Readable source includes goal-based navigation and is compacted before delivery.
          # CI checkout measures 74,206 bytes; the deployed minified CSS is 73,147 bytes.
          # Allow 76 KB CSS source for accessible practice controls; retain 400 KB Worker / 10 KB JS ceilings.
          test $(wc -c < cloudflare/site-v2/site.css) -lt 76000
          test $(wc -c < cloudflare/site-v2/site.js) -lt 10000
      - uses: actions/upload-artifact@v4
        with:
          name: toefl-v2-release-worker
          path: cloudflare/site-v2/dist/_worker.js
          retention-days: 14

  candidate-browser:
    name: Browser-check compiled candidate (isolated fixtures)
    needs: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: toefl-v2-release-worker
          path: cloudflare/site-v2/dist
      - name: Install browser test dependencies
        run: npm install --prefix /tmp/toefl-candidate --no-save playwright-core@1.56.0 axe-core@4.10.3 --silent
      - name: Test downloaded Worker with synthetic CMS and blocked external network
        env:
          NODE_PATH: /tmp/toefl-candidate/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          TOEFL_SCREENSHOTS: ${{ runner.temp }}/toefl-candidate-screenshots
          TOEFL_VISUAL_DIR: ${{ runner.temp }}/toefl-candidate-screenshots/matrix
          TOEFL_FULLPAGE_DIR: ${{ runner.temp }}/toefl-candidate-screenshots/fullpage
          TOEFL_AXE_ALL: '1'
        run: node cloudflare/site-v2/candidate-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-browser-screenshots
          path: |
            ${{ runner.temp }}/toefl-candidate-screenshots/*.png
            ${{ runner.temp }}/toefl-candidate-screenshots/matrix/*.png
            ${{ runner.temp }}/toefl-candidate-screenshots/fullpage/*.png
          retention-days: 7
          if-no-files-found: ignore

  historical-package:
    name: Assemble unapproved candidate and historical assets
    needs: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: toefl-v2-release-worker
          path: ${{ runner.temp }}/candidate-worker
      # Public snapshot captured on 17 November. It is NOT proof of the active
      # production manifest: the release operator must independently compare it.
      - uses: actions/download-artifact@v4
        with:
          name: toefl-house-pages-public-snapshot
          path: ${{ runner.temp }}/historical-snapshot
          github-token: ${{ github.token }}
          run-id: 44041822731
      - name: Require every historical path and record SHA-256 for the package
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_BUILD_REF: ${{ github.sha }}
        run: |
          node cloudflare/site-v2/package-candidate.mjs "$RUNNER_TEMP/historical-snapshot" "$RUNNER_TEMP/candidate-worker/_worker.js" "$RUNNER_TEMP/toefl-unapproved-package" "$SOURCE_COMMIT" "$TESTED_BUILD_REF"
      - name: Compare historical package to canonical public asset responses (read-only)
        run: |
          node cloudflare/site-v2/compare-public-assets.mjs "$RUNNER_TEMP/toefl-unapproved-package/PACKAGE-INVENTORY.json" "$RUNNER_TEMP/toefl-unapproved-package/PUBLIC-ASSET-COMPARISON.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toefl-unapproved-candidate-with-historical-assets
          path: ${{ runner.temp }}/toefl-unapproved-package/
          retention-days: 14
          if-no-files-found: error

  production-site:
    name: Verify live content and security
    needs: build-and-unit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published URLs, indexing, CMS and safe tools isolation
        run: |
          node cloudflare/site-v2/production-full-acceptance.mjs
          node cloudflare/site-v2/final-production-navigation.mjs
          node cloudflare/site-v2/general-english-live-acceptance.mjs
      - name: Check anonymous auth, publish refusal and no retired-origin dependency
        run: |
          node cloudflare/cms-readiness/public-auth-readonly.mjs
          node cloudflare/cms-readiness/legacy-dependency.mjs

  accessibility:
    name: WCAG A and AA audit
    needs: build-and-unit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up isolated browser
        run: npm install --prefix /tmp/toefl-accessibility --no-save playwright-core@1.56.0 axe-core@4.10.3 --silent
      - name: Audit home, TOEFL and admissions in three languages
        run: node cloudflare/site-v2/accessibility-audit.cjs

  public-cms-recovery:
    name: Archive only public CMS content (no credentials)
    needs: production-site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate published course catalog and create checked content snapshot
        run: node cloudflare/cms-readiness/public-content-snapshot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: toefl-public-cms-recovery-snapshot
          path: toefl-public-content-recovery/
          retention-days: 30
          if-no-files-found: error
