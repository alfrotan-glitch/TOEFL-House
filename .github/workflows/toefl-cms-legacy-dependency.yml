name: TOEFL House Legacy CMS Dependency Gate
on:
  push:
    branches: [cms-readiness-and-recovery-20261118]
    paths:
      - 'cloudflare/cms-readiness/legacy-dependency.mjs'
      - '.github/workflows/toefl-cms-legacy-dependency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify both immutable upstream versions and canonical student toolkit
        run: node cloudflare/cms-readiness/legacy-dependency.mjs
