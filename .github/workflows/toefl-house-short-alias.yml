name: TOEFL House — Free short address production acceptance
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/short-alias/**'
      - '.github/workflows/toefl-house-short-alias.yml'
  workflow_dispatch:
    inputs:
      short_url:
        description: "Approved Cloudflare preview or production short link"
        required: false
        default: "https://thaf.pages.dev"
permissions:
  contents: read
jobs:
  smoke:
    name: Dari default, EN/PS, admissions, safe proxy and SEO
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TH_SHORT_BASE: ${{ inputs.short_url || 'https://thaf.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live Cloudflare short alias without writes
        run: node --test cloudflare/short-alias/tests/shortlink.test.mjs

  browser-smoke:
    name: Real Chrome mobile — Dari, EN, PS, course enrollment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TH_SHORT_BASE: ${{ inputs.short_url || 'https://thaf.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser runner
        run: npm install --prefix /tmp/toefl-short-browser --no-save playwright-core@1.56.0 --silent
      - name: Check mobile rendering, language switches and admissions
        run: node cloudflare/short-alias/tests/browser.cjs
      - name: Archive screenshots of actual short site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-address-mobile-proof
          path: /tmp/toefl-short-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
