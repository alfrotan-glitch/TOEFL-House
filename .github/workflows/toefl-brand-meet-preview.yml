name: Brand and Google Meet release preview
on:
  push:
    branches: [qa/brand-meet-957e7c7-20261126]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TOEFL_QA_BASE: https://92cf5037.toeflhouse.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 957e7c7730162e4fe6ee07bb70faa2b6bd6f5c0a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and online class copy
        run: |
          test "$(git rev-parse HEAD)" = "957e7c7730162e4fe6ee07bb70faa2b6bd6f5c0a"
          node --input-type=module -e 'import assert from "node:assert/strict"; for(const prefix of ["/","/fa/","/ps/"]){for(const path of [prefix,prefix+"admissions/",prefix+"courses/online-individual-zoom/"]){const r=await fetch(process.env.TOEFL_QA_BASE+path);assert.equal(r.status,200,path);const h=await r.text();assert.ok(h.includes("Google Meet"),path);assert.ok(h.includes("58c4444cbb6d"),path);assert.doesNotMatch(h,/(?<![\\w-])Zoom(?![\\w-])/i,path);}}'
      - name: Verify all public routes and protected boundaries
        run: node cloudflare/site-v2/production-full-acceptance.mjs
      - run: npm install --prefix /tmp/toefl-accessibility --no-save playwright-core@1.56.0 axe-core@4.10.3 --silent
      - name: Verify WCAG A and AA
        run: node cloudflare/site-v2/accessibility-audit.cjs
