name: Diagnose 320px homepage overflow
on:
  push:
    branches: [qa/overflow-320-diagnosis]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/toefl-overflow --no-save playwright-core@1.56.0 --silent
      - name: Inspect horizontal bounds and clipping ancestry
        run: |
          node <<'NODE'
          const {chromium}=require("/tmp/toefl-overflow/node_modules/playwright-core");
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:"/usr/bin/google-chrome",args:["--no-sandbox","--disable-dev-shm-usage"]});
            try{
              const page=await browser.newPage({viewport:{width:320,height:900}});
              await page.goto("https://toeflhouse.pages.dev/",{waitUntil:"networkidle"});
              await page.evaluate(()=>document.fonts.ready);
              console.log(JSON.stringify(await page.evaluate(()=>{
                const width=innerWidth;
                const elements=[...document.querySelectorAll("body *")].flatMap(el=>{
                  const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                  if(!r.width||r.right<=width+1&&r.left>=-1)return [];
                  const ancestors=[];for(let p=el.parentElement;p;p=p.parentElement){const c=getComputedStyle(p);if(["hidden","clip","auto","scroll"].includes(c.overflowX))ancestors.push({tag:p.tagName,cls:p.className,overflow:c.overflowX});}
                  return [{tag:el.tagName,cls:String(el.className),text:el.textContent?.trim().slice(0,70),left:r.left,right:r.right,width:r.width,minWidth:s.minWidth,whiteSpace:s.whiteSpace,position:s.position,ancestors}];
                });
                return {viewport:width,scrollWidth:document.documentElement.scrollWidth,unclipped:elements.filter(e=>!e.ancestors.length).slice(0,50),clipped:elements.filter(e=>e.ancestors.length).slice(0,8)};
              }),null,2));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
