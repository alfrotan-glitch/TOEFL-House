name: Canonical V3 English performance repeat and safe-read verification
on:
  push:
    branches: [qa/production-en-perf-repeat-d80e575]
permissions:
  contents: read
jobs:
  repeat-live-en:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm canonical indexability, 39 routes and read-only public checks
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://toeflhouse.pages.dev';
          for(const prefix of ['/','/fa/','/ps/']){
            const r=await fetch(base+prefix),html=await r.text();
            assert.equal(r.status,200,prefix);
            assert.equal(r.headers.get('x-robots-tag'),null,'Production must be indexable');
            assert.ok(html.includes('628767df8e41'),'Published revision changed');
            assert.ok(html.includes('Google Meet'),'Learning format copy missing');
          }
          const xml=await(await fetch(base+'/sitemap.xml')).text();
          assert.equal((xml.match(/<loc>/g)||[]).length,39);
          for(const p of ['/admissions/','/fa/admissions/','/ps/admissions/']){
            assert.equal((await fetch(base+p)).status,200,p);
            const head=await fetch(base+p,{method:'HEAD'});
            assert.equal(head.status,200,p);
            assert.equal(await head.text(),'');
          }
          console.log('Canonical 39 routes, indexing, three locales and admissions GET/HEAD passed; no submissions');
          NODE
      - name: Repeat canonical English Lighthouse three times
        run: |
          export CHROME_PATH=/usr/bin/google-chrome
          mkdir -p reports
          for n in 1 2 3; do
            npx --yes lighthouse@12.8.2 "https://toeflhouse.pages.dev/" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="reports/en-$n.json" --quiet
          done
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const data=[1,2,3].map(n=>{
            const x=JSON.parse(fs.readFileSync('reports/en-'+n+'.json','utf8'));
            return {performance:x.categories.performance.score,seo:x.categories.seo.score,accessibility:x.categories.accessibility.score,bestPractices:x.categories['best-practices'].score,TBT:x.audits['total-blocking-time'].numericValue,LCP:x.audits['largest-contentful-paint'].numericValue};
          });
          const median=k=>data.map(x=>x[k]).sort((a,b)=>a-b)[1];
          const summary={runs:data,medianPerformance:median('performance'),medianTBT:median('TBT'),medianLCP:median('LCP')};
          console.log(JSON.stringify(summary,null,2));
          fs.writeFileSync('reports/summary.json',JSON.stringify(summary,null,2));
          assert.ok(data.every(x=>x.seo===1&&x.accessibility===1&&x.bestPractices===1),'Canonical SEO/A11y/best-practice failure');
          assert.ok(median('performance')>=0.90,'Canonical EN performance median below threshold');
          assert.ok(median('TBT')<=350,'Canonical EN TBT median too high');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-v3-en-repeat-evidence
          path: reports/
