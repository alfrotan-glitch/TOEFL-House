name: TOEFL House V2 Production Anonymous Conversion Acceptance
on:
  push:
    branches: [website-v2-performance-admissions-20261118]
    paths:
      - 'cloudflare/site-v2/live-conversion-qa.cjs'
      - '.github/workflows/toefl-v2-live-conversion-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/toefl-live-conversion --no-save playwright-core@1.56.0 --silent
      - name: Verify anonymous course-attributed events, intercept all analytics and WhatsApp requests
        run: node cloudflare/site-v2/live-conversion-qa.cjs
