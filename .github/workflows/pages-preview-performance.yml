name: TOEFL House upgrade performance comparison

on:
  push:
    branches:
      - website-source-control-20261117
    paths:
      - "cloudflare/pages-edge/performance.mjs"
      - ".github/workflows/pages-preview-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node cloudflare/pages-edge/performance.mjs
