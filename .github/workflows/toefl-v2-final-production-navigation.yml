name: TOEFL House V2 Final Production Navigation Acceptance
on:
  push:
    branches: [website-v2-redesign-20261118]
    paths: ['cloudflare/site-v2/final-production-navigation.mjs','.github/workflows/toefl-v2-final-production-navigation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cloudflare/site-v2/final-production-navigation.mjs
