name: TOEFL House General English Exact Preview Visual & WCAG Acceptance
on:
  push:
    branches: [general-english-researched-curriculum-20261119]
    paths:
      - 'cloudflare/site-v2/general-english-browser.cjs'
      - '.github/workflows/toefl-general-english-preview-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/toefl-ge-browser --no-save playwright-core@1.56.0 axe-core@4.10.3 --silent
      - name: Audit six English-Dari-Pashto mobile and desktop browser views
        run: node cloudflare/site-v2/general-english-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-english-visual-acceptance
          path: general-english-qa/*.png
          retention-days: 7
          if-no-files-found: ignore
