name: General English premium — exact preview acceptance
on:
  push:
    branches: [qa/ge-premium-acc6400]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TOEFL_QA_BASE: https://765e84e8.toeflhouse.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acc64005aed0c47d1abd68720a4e129f286376fd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate source and served CSS/JS fingerprint
        run: |
          test "$(git rev-parse HEAD)" = "acc64005aed0c47d1abd68720a4e129f286376fd"
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from "node:fs/promises";
          const path="cloudflare/site-v2/build.mjs";
          const s=await readFile(path,"utf8");
          const marker="const buildDate=new Date().toISOString().slice(0,10);";
          if(!s.includes(marker))throw Error("Build date expression moved");
          await writeFile(path,s.replace(marker,'const buildDate="2026-11-27";'));
          NODE
          node cloudflare/site-v2/build.mjs
          node --check cloudflare/site-v2/dist/_worker.js
          echo '3fb0c593d2707a1ba074344c14cce7c1b893415fb66dc2e4019f857fadb7b9b3  cloudflare/site-v2/dist/_worker.js' | sha256sum -c -
          test "$(wc -c < cloudflare/site-v2/dist/_worker.js)" -eq 357046
          test "$(wc -c < cloudflare/site-v2/dist/_worker.js)" -lt 400000
          git restore cloudflare/site-v2/build.mjs
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {readFile} from "node:fs/promises";
          import {createHash} from "node:crypto";
          const css=(await readFile("cloudflare/site-v2/site.css","utf8")).replace(/\/\*[\s\S]*?\*\//g,"").split("\n").map(x=>x.trim()).join("");
          const js=await readFile("cloudflare/site-v2/site.js","utf8");
          const rev=createHash("sha256").update(css).update(js).digest("hex").slice(0,12);
          for(const [path,expected] of [["/__th/v2/site.css",css],["/__th/v2/site.js",js]]){
            const r=await fetch(process.env.TOEFL_QA_BASE+path);assert.equal(r.status,200);assert.equal(await r.text(),expected,path);
          }
          for(const p of ["/","/fa/","/ps/"]){
            const r=await fetch(process.env.TOEFL_QA_BASE+p);assert.equal(r.status,200,p);
            const h=await r.text();assert.ok(h.includes("site.css?v="+rev),p);assert.ok(h.includes("Google Meet"),p);
            assert.equal(h.includes('rel="preload" href="/__th/v2/font/vazirmatn-33.003.woff2"'),p!=="/",p);
            assert.match(r.headers.get("x-robots-tag")||"",/noindex/);
          }
          console.log({assetRevision:rev,workerSHA256:createHash("sha256").update(await readFile("cloudflare/site-v2/dist/_worker.js")).digest("hex")});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ge-premium-worker-3fb0c593
          path: cloudflare/site-v2/dist/_worker.js
          if-no-files-found: error
      - run: node --test cloudflare/site-v2/tests/*.test.mjs
      - run: node cloudflare/site-v2/general-english-live-acceptance.mjs
      - name: Verify new course copy is actually served in each language
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const cases=[["/courses/general-english/","A practical foundation for your next step","English for life. A foundation for what comes next.","1–2 months per stage"],["/fa/courses/general-english/","بنیادی استوار برای گام بعدی شما","انگلیسی برای زندگی؛ بنیادی برای آینده.","۱ تا ۲ ماه برای هر سطح"],["/ps/courses/general-english/","د راتلونکي ګام لپاره پیاوړی بنسټ","د ژوند لپاره انګلیسي؛ د راتلونکي لپاره بنسټ.","د هرې کچې لپاره ۱ تر ۲ میاشتو"]];
          for(const [path,...markers] of cases){
            const res=await fetch(process.env.TOEFL_QA_BASE+path);
            assert.equal(res.status,200,path);
            assert.match(res.headers.get("x-robots-tag")||"",/noindex/);
            const html=await res.text();
            for(const marker of markers)assert.ok(html.includes(marker),path+" "+marker);
          }
          NODE
      - run: node cloudflare/site-v2/production-full-acceptance.mjs
      - run: npm install --prefix /tmp/toefl-accessibility --no-save playwright-core@1.56.0 axe-core@4.10.3 --silent
      - run: node cloudflare/site-v2/final-production-navigation.mjs
      - name: Record Pashto font use and screenshot without submitting data
        run: |
          mkdir -p visual
          node <<'NODE'
          const assert=require("node:assert/strict");
          const {chromium}=require("/tmp/toefl-accessibility/node_modules/playwright-core");
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:"/usr/bin/google-chrome",args:["--no-sandbox","--disable-dev-shm-usage"]});
            try{
              for(const width of [320,390,1440]){
                const page=await browser.newPage({viewport:{width,height:900},serviceWorkers:"block"});
                await page.route("**/*",r=>["GET","HEAD","OPTIONS"].includes(r.request().method())?r.continue():r.abort());
                const r=await page.goto(process.env.TOEFL_QA_BASE+"/ps/",{waitUntil:"networkidle"});
                assert.equal(r.status(),200);
                await page.evaluate(()=>document.fonts.ready);
                const loaded=await page.evaluate(()=>document.fonts.check('700 32px THDari','پښتو ښ ځ ږ څ ڼ ډ ټ ړ'));
                assert.ok(loaded,"Pashto font not ready");
                const cdp=await page.context().newCDPSession(page);
                await cdp.send("DOM.enable");await cdp.send("CSS.enable");
                const {root}=await cdp.send("DOM.getDocument");
                const {nodeId}=await cdp.send("DOM.querySelector",{nodeId:root.nodeId,selector:"h1"});
                const {fonts}=await cdp.send("CSS.getPlatformFontsForNode",{nodeId});
                console.log(JSON.stringify({width,loaded,fonts}));
                assert.ok(fonts.some(f=>f.isCustomFont&&/Vazirmatn/i.test(f.familyName+" "+f.postScriptName)),"Heading did not render with custom Vazirmatn");
                await page.screenshot({path:"visual/pashto-"+width+".png"});
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge-premium-font-visual
          path: visual/
      - name: Verify responsive geometry, heading, language and brand at four widths
        run: |
          node <<'NODE'
          const {chromium}=require("/tmp/toefl-accessibility/node_modules/playwright-core");
          const assert=require("node:assert/strict");
          const axe=require('/tmp/toefl-accessibility/node_modules/axe-core');
          (async()=>{
            const base=process.env.TOEFL_QA_BASE;
            const xml=await (await fetch(base+"/sitemap.xml")).text();
            const paths=[...new Set([...xml.matchAll(/<loc>(https:\/\/toeflhouse\.pages\.dev[^<]+)<\/loc>/g)].map(m=>new URL(m[1]).pathname))];
            assert.ok(paths.length>=39);
            const browser=await chromium.launch({headless:true,executablePath:"/usr/bin/google-chrome",args:["--no-sandbox","--disable-dev-shm-usage"]});
            const issues=[];let checked=0,axeChecked=0;
            try{
              for(const width of [320,390,768,1440]){
                const page=await browser.newPage({viewport:{width,height:900},bypassCSP:true,serviceWorkers:"block"});
                await page.route("**/*",r=>["GET","HEAD","OPTIONS"].includes(r.request().method())?r.continue():r.abort());
                for(const path of paths){
                  try{
                    const response=await page.goto(base+path,{waitUntil:"domcontentloaded",timeout:30000});
                    await page.evaluate(()=>document.fonts.ready);
                    const v=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,h1:document.querySelectorAll("h1").length,lang:document.documentElement.lang,dir:document.documentElement.dir,brand:getComputedStyle(document.documentElement).getPropertyValue("--red").trim()}));
                    const lang=path.startsWith("/fa/")?"fa-AF":path.startsWith("/ps/")?"ps-AF":"en";
                    if(response.status()!==200||v.overflow>1||v.h1!==1||v.lang!==lang||v.dir!==(lang==="en"?"ltr":"rtl")||v.brand!=="#c00818")issues.push({path,width,status:response.status(),...v});
                    if(width===390){
                      await page.addScriptTag({content:axe.source});
                      const violations=await page.evaluate(async()=> (await axe.run(document,{runOnly:{type:"tag",values:["wcag2a","wcag2aa","wcag21a","wcag21aa"]}})).violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>n.target)})));
                      if(violations.length)issues.push({path,width,violations});
                      axeChecked++;
                    }
                    checked++;
                  }catch(e){issues.push({path,width,error:String(e)});}
                }
                await page.close();
              }
            }finally{await browser.close();}
            console.log(JSON.stringify({checked,axeChecked,issues},null,2));assert.deepEqual(issues,[]);
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p reports
          export CHROME_PATH=/usr/bin/google-chrome
          for locale in en fa ps; do
            suffix=""
            if [ "$locale" != en ]; then suffix="$locale/"; fi
            npx --yes lighthouse@12.8.2 "https://765e84e8.toeflhouse.pages.dev/$suffix" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="reports/$locale.json" --quiet
          done
          node -e 'for(const locale of ["en","fa","ps"]){const r=require("./reports/"+locale+".json");console.log(JSON.stringify({locale,scores:Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score])),LCP:r.audits["largest-contentful-paint"].numericValue,CLS:r.audits["cumulative-layout-shift"].numericValue,TBT:r.audits["total-blocking-time"].numericValue}));}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge-premium-preview-performance
          path: reports/
