name: Dari campus image delivery evidence
on:
  push:
    branches:
      - qa/dari-campus-image-optimization-d80e575
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Compare existing public photographs and measure same-photo WebP options
        shell: bash
        run: |
          mkdir -p reports
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageChops, ImageStat
          from urllib.request import urlopen, Request
          import hashlib, io, json
          from pathlib import Path
          base = 'https://toeflhouse.pages.dev/assets/aistudio/'
          names = ['FB_IMG_1793645643808_dad823ce.jpg','campus-640_c222a08a.webp','campus-960_85648e8f.webp','campus_dfe458a8.webp']
          report = []
          imgs = []
          def fetch(url):
              with urlopen(Request(url, headers={'User-Agent':'TOEFL-House-read-only-QA/1.0'}), timeout=30) as r:
                  assert r.status == 200
                  return r.read()
          for name in names:
              data = fetch(base + name)
              im = ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert('RGB')
              report.append({'name':name,'bytes':len(data),'width':im.width,'height':im.height,'sha256':hashlib.sha256(data).hexdigest()})
              imgs.append((name,im))
          original = imgs[0][1]
          for width in (480,640,original.width):
              if width > original.width: continue
              im = original.copy()
              im.thumbnail((width,2000),Image.Resampling.LANCZOS)
              for quality in (78,85):
                  b = io.BytesIO()
                  im.save(b, format='WEBP',quality=quality,method=6)
                  name = f'same-photo-{width}-q{quality}.webp'
                  data = b.getvalue()
                  Path('reports',name).write_bytes(data)
                  restored=Image.open(io.BytesIO(data)).convert('RGB')
                  error=ImageStat.Stat(ImageChops.difference(im,restored)).mean
                  report.append({'name':name,'bytes':len(data),'width':im.width,'height':im.height,'sha256':hashlib.sha256(data).hexdigest(),'mean_absolute_rgb_error':error})
                  if quality==85: imgs.append((name,restored))
          sheet=Image.new('RGB',(960,((len(imgs)+2)//3)*390),'white')
          draw=ImageDraw.Draw(sheet)
          for i,(name,im) in enumerate(imgs):
              thumb=ImageOps.contain(im,(304,345))
              x=(i%3)*320;y=(i//3)*390
              sheet.paste(thumb,(x+(320-thumb.width)//2,y))
              draw.text((x+5,y+350),name[:40],fill='black')
          sheet.save('reports/visual-comparison.jpg',quality=92)
          Path('reports/results.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: campus-image-delivery-evidence
          path: reports/
          if-no-files-found: error
