name: TOEFL House V2 Admissions and Guides Preview Acceptance
on:
  push:
    branches: [website-v2-performance-admissions-20261118]
    paths:
      - 'cloudflare/site-v2/admissions-campaign-preview.cjs'
      - '.github/workflows/toefl-v2-admissions-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/toefl-final-qa --no-save playwright-core@1.56.0 --silent
      - name: Verify complete student journey and safe WhatsApp message without contacting reception
        run: node cloudflare/site-v2/admissions-campaign-preview.cjs
